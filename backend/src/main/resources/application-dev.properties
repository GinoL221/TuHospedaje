# Dev profile — local-only defaults. Never commit real secrets.
# Activate with: SPRING_PROFILES_ACTIVE=dev  or  --spring.profiles.active=dev
app.business-time-zone=America/Argentina/Buenos_Aires

# External canonical masters are served only in this profile. The default is
# configured in application.properties; override with
# TUHOSPEDAJE_CANONICAL_ASSETS_ROOT when needed.

# Database — isolated MariaDB 10.11 on 3307 (docker compose). Host 3306 is left alone.
spring.datasource.url=jdbc:mariadb://localhost:3307/tuhospedaje_dev
spring.datasource.username=tuhospedaje
spring.datasource.password=tuhospedaje123

# Schema only. Demo data is an explicit opt-in:
# SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/dev
# DEV_ADMIN_PASSWORD_HASH must contain a valid bcrypt hash when the seed is enabled.
# Development-only Flyway migrations use the reserved Vx_9000+ namespace so they do
# not consume the next production schema version. The application accepts db/dev only
# when "dev" is the sole active profile. These migrations are one-shot and MariaDB DDL
# is not transactional: use only a disposable database whose name contains a standalone
# "dev" or "test" segment. After any failed seed or seed-version change, drop and
# recreate the database before retrying.
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.dev_admin_password_hash=${DEV_ADMIN_PASSWORD_HASH:}

# JWT — long dev-only secret (base64-safe, ≥256 bits)
app.jwt.secret=devsecret1234567890123456789012345678901234567890123456789012
app.jwt.expiration=28800000

# Auth cookie — Secure=false locally (no HTTPS on localhost)
app.cookie.secure=false
app.cookie.same-site=Strict
app.session.access-token-lifetime=PT15M
app.session.refresh.enabled=true
app.session.refresh.absolute-lifetime=P30D
app.session.key-ring.active-key-id=${SESSION_ACTIVE_KEY_ID:dev-rt1}
app.session.key-ring.key-entries[0].id=${SESSION_ACTIVE_KEY_ID:dev-rt1}
app.session.key-ring.key-entries[0].secret=${SESSION_REFRESH_KEY:dev-only-refresh-key-not-for-production}
app.session.cleanup.interval=P1D
app.session.cleanup.batch-size=100
app.session.rate-limit.enabled=true
app.session.rate-limit.refresh-per-family-per-minute=10
app.session.rate-limit.refresh-per-ip-per-minute=60

# Auth rate limiting — relaxed for CI e2e (Playwright workers share one loopback IP
# against a long-lived backend) and local dev iteration. Deliberately different from prod.
app.auth.rate-limit.enabled=true
app.auth.rate-limit.login-per-ip-per-minute=100
app.auth.rate-limit.login-per-email-per-minute=50
app.auth.rate-limit.register-per-ip-per-minute=50
app.auth.rate-limit.register-per-email-per-minute=20

# Welcome CTA destination. Not localhost; override for a real public app URL.
tuhospedaje.email.welcome.public-base-url=${TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL:https://app.example}

# CORS — local frontend
app.cors.allowed-origins=http://localhost:5173

# SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
