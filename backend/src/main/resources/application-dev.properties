# Dev profile — local-only defaults. Never commit real secrets.
# Activate with: SPRING_PROFILES_ACTIVE=dev  or  --spring.profiles.active=dev

# Database — local MariaDB
spring.datasource.username=tuhospedaje
spring.datasource.password=tuhospedaje123

# Schema only. Demo data is an explicit opt-in:
# SPRING_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/dev
# DEV_ADMIN_PASSWORD_HASH must contain a valid bcrypt hash when the seed is enabled.
# Development-only Flyway migrations use the reserved Vx_9000+ namespace so they do
# not consume the next production schema version. The application accepts db/dev only
# when "dev" is the sole active profile. These migrations are one-shot and MariaDB DDL
# is not transactional: use only a disposable database whose name contains a standalone
# "dev" or "test" segment. After any failed seed or seed-version change, drop and
# recreate the database before retrying.
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.dev_admin_password_hash=${DEV_ADMIN_PASSWORD_HASH:}

# JWT — long dev-only secret (base64-safe, ≥256 bits)
app.jwt.secret=devsecret1234567890123456789012345678901234567890123456789012
app.jwt.expiration=28800000

# Auth cookie — Secure=false locally (no HTTPS on localhost)
app.cookie.secure=false
app.cookie.same-site=Strict

# CORS — local frontend
app.cors.allowed-origins=http://localhost:5173

# SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
