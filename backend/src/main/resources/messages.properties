# Default (English) i18n bundle for GlobalExceptionHandler.

# LodgingController /search pagination params (@Min message keys)
error.page.negative=Page index must not be negative.
error.size.negative=Size must be greater than zero.
error.size.max=Size must not exceed 100.
error.search.guests.positive=Guests must be greater than zero.
error.search.price.non_negative=Prices must not be negative.
error.search.dates.required=Check-in and check-out dates must be provided together.
error.search.dates.order=Check-in must be before check-out.
error.search.price.range=Minimum price must not exceed maximum price.
error.lodging.not_found=Lodging not found with ID: {0}
error.lodging.has_reservations=Cannot delete lodging because it has associated reservations.

# Duplicate resource names (409 via DuplicateResourceException) and business rules that
# stay 400 (LocalizedIllegalArgumentException) — issue #452. The rejected name and the
# lodging count travel as MessageFormat arguments ({0}).
error.category.duplicate_name=A category with the name {0} already exists.
error.feature.duplicate_name=A feature with the name {0} already exists.
error.policy.duplicate_name=A policy with the name {0} already exists.
error.category.in_use=Cannot delete the category: {0} lodging(s) are using it.
error.rating.not_eligible=Only guests with a confirmed and finished stay can rate this lodging.

# ResourceNotFoundException fallback (no errorCode set). Passthrough: wraps whatever
# message the exception was thrown with, since the only real throw site
# (ReservationServiceImpl) still uses hardcoded Spanish text, not a message key.
error.resource.not_found={0}

# Standard exception responses
error.auth.invalid=Invalid credentials.
error.auth.required=Authentication is required.
error.access_denied=You do not have permission to perform this action.
error.csrf_invalid=Your security token is missing or has expired. Reload the page and try again.
error.auth.duplicate_email=This email is already registered.
error.auth.password.required=Password is required.
error.auth.password.size=Password must be between 6 and 20 characters.
error.auth.password.uppercase=Password must contain at least one uppercase letter.
error.auth.password.number=Password must contain at least one number.
error.validation=Validation error.
error.optimistic_lock=The reservation was modified by another user. Try again.
error.pessimistic_lock=The resource is being modified. Try again in a few seconds.
error.user.last_enabled_admin=At least one enabled administrator must remain.
error.upload=Error processing the image.
# Upload rejections decided before any bytes reach disk (400) and by the
# multipart parser's size ceiling (413) — see ImageContentValidator and
# spring.servlet.multipart.max-file-size.
error.upload.empty=The uploaded file is empty.
error.upload.invalid_type=Only JPEG, PNG, WebP and GIF images are allowed.
error.upload.too_large=The image exceeds the maximum allowed size.
error.data_integrity=Missing required fields or invalid data.
# Client-side request errors: without these handlers they reach the catch-all and
# answer 500, hiding real outages behind caller mistakes.
error.request.malformed=The request body could not be read. Check the JSON syntax.
error.request.method_not_supported=That HTTP method is not supported for this resource.
error.request.media_type_not_supported=That content type is not supported for this resource.
error.request.missing_parameter=A required request parameter is missing.
error.internal=Internal server error.

# Refresh session (Delta Spec session-refresh domain): a single generic message for every
# rejection reason (missing/expired/reused/unknown/disabled-user) — deliberately
# non-disclosing, so the response never confirms which reason applied.
error.session.refresh_invalid=Invalid session.

# Auth rate limiting (AuthRateLimitFilter): identical for every dimension/endpoint —
# deliberately non-disclosing, matches GlobalExceptionHandler's {error,status} shape.
error.rate_limit=Too many attempts. Try again later.
