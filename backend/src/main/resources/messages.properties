# Default (English) i18n bundle for GlobalExceptionHandler.

# LodgingController /search pagination params (@Min message keys)
error.page.negative=Page index must not be negative.
error.size.negative=Size must be greater than zero.
error.size.max=Size must not exceed 100.

# ResourceNotFoundException fallback (no errorCode set). Passthrough: wraps whatever
# message the exception was thrown with, since the only real throw site
# (ReservationServiceImpl) still uses hardcoded Spanish text, not a message key.
error.resource.not_found={0}

# Standard exception responses
error.auth.invalid=Invalid credentials.
error.validation=Validation error.
error.optimistic_lock=The reservation was modified by another user. Try again.
error.pessimistic_lock=The resource is being modified. Try again in a few seconds.
error.upload=Error processing the image.
error.data_integrity=Missing required fields or invalid data.
error.internal=Internal server error.

# Refresh session (Delta Spec session-refresh domain): a single generic message for every
# rejection reason (missing/expired/reused/unknown/disabled-user) — deliberately
# non-disclosing, so the response never confirms which reason applied.
error.session.refresh_invalid=Invalid session.
