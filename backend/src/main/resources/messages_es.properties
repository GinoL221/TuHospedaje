# Spanish i18n bundle for GlobalExceptionHandler. See messages.properties for scope notes.

# LodgingController /search pagination params (@Min message keys)
error.page.negative=El índice de página no debe ser negativo.
error.size.negative=El tamaño debe ser mayor a cero.
error.size.max=El tamaño no debe superar 100.
error.search.guests.positive=La cantidad de huéspedes debe ser mayor a cero.
error.search.price.non_negative=Los precios no pueden ser negativos.
error.search.dates.required=Las fechas de entrada y salida deben enviarse juntas.
error.search.dates.order=La fecha de entrada debe ser anterior a la de salida.
error.search.price.range=El precio mínimo no puede superar el precio máximo.
error.lodging.not_found=Alojamiento no encontrado con ID: {0}

# ResourceNotFoundException fallback (no errorCode set) — passthrough, see messages.properties.
error.resource.not_found={0}

# Standard exception responses
error.auth.invalid=Credenciales inválidas.
error.auth.duplicate_email=Ese email ya está registrado.
error.validation=Error de validación.
error.optimistic_lock=La reserva fue modificada por otro usuario. Intentá de nuevo.
error.pessimistic_lock=El recurso está siendo modificado. Intentá de nuevo en unos segundos.
error.user.last_enabled_admin=Debe permanecer al menos un administrador habilitado.
error.upload=Error al procesar la imagen.
# Rechazos de upload resueltos antes de llamar a Cloudinary (400) y por el límite
# de tamaño del parser multipart (413) — ver CloudinaryServiceImpl y
# spring.servlet.multipart.max-file-size.
error.upload.empty=El archivo subido está vacío.
error.upload.invalid_type=Solo se permiten imágenes JPEG, PNG, WebP y GIF.
error.upload.too_large=La imagen supera el tamaño máximo permitido.
error.data_integrity=Faltan campos obligatorios o hay datos inválidos.
error.internal=Error interno del servidor.

# Sesión de refresco (dominio session-refresh del Delta Spec): un único mensaje genérico
# para cualquier motivo de rechazo (ausente/expirado/reusado/desconocido/usuario
# deshabilitado) — deliberadamente no revelador.
error.session.refresh_invalid=Sesión inválida.

# Rate limiting de auth (AuthRateLimitFilter): idéntico para cualquier dimensión/endpoint —
# deliberadamente no revelador, igual forma {error,status} que GlobalExceptionHandler.
error.rate_limit=Demasiados intentos. Intente nuevamente mas tarde.
