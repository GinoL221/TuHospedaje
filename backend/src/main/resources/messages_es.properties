# Spanish i18n bundle for GlobalExceptionHandler. See messages.properties for scope notes.

# LodgingController /search pagination params (@Min message keys)
error.page.negative=El índice de página no debe ser negativo.
error.size.negative=El tamaño debe ser mayor a cero.
error.size.max=El tamaño no debe superar 100.

# ResourceNotFoundException fallback (no errorCode set) — passthrough, see messages.properties.
error.resource.not_found={0}

# Standard exception responses
error.auth.invalid=Credenciales inválidas.
error.validation=Error de validación.
error.optimistic_lock=La reserva fue modificada por otro usuario. Intentá de nuevo.
error.pessimistic_lock=El recurso está siendo modificado. Intentá de nuevo en unos segundos.
error.upload=Error al procesar la imagen.
error.data_integrity=Faltan campos obligatorios o hay datos inválidos.
error.internal=Error interno del servidor.

# Sesión de refresco (dominio session-refresh del Delta Spec): un único mensaje genérico
# para cualquier motivo de rechazo (ausente/expirado/reusado/desconocido/usuario
# deshabilitado) — deliberadamente no revelador.
error.session.refresh_invalid=Sesión inválida.
