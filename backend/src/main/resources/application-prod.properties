# Production repeats the schema safety invariants so profile overrides cannot re-enable mutation.
app.business-time-zone=${BUSINESS_TIME_ZONE:America/Argentina/Buenos_Aires}

# Reverse Proxy & Real Client IP Resolution
# When running behind nginx in Docker, RemoteIpValve extracts the client IP from
# X-Forwarded-For and X-Forwarded-Proto so per-IP rate limits isolate individual users
# rather than pooling all traffic behind nginx's container IP.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TOMCAT_INTERNAL_PROXIES:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1}

# Access token TTL in production: 15 minutes (900000 ms).
# Short-lived access tokens require refresh token rotation and limit exposure
# window if a token is intercepted.
app.jwt.expiration=${APP_JWT_EXPIRATION:900000}

# Swagger UI and OpenAPI documentation are disabled by default in production
# to prevent exposing API internals and schema details to unauthenticated users.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_MIGRATION_USERNAME}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
