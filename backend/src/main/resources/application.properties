spring.application.name=tuhospedaje

# Local dev: load environment variables from a .env file (KEY=value) if present.
# optional: → in production the file is absent and real OS env vars are used instead.
# Real OS env vars take precedence over this file, so production secrets always win.
spring.config.import=optional:file:.env[.properties]

# Servidor
server.port=8080
app.business-time-zone=America/Argentina/Buenos_Aires

# Local canonical lodging masters. The dev profile serves this directory at
# /canonical-lodging-images/**. Override with TUHOSPEDAJE_CANONICAL_ASSETS_ROOT
# when the assets live outside the default ~/TuHospedajeAssets location.
tuhospedaje.canonical-assets.root=${TUHOSPEDAJE_CANONICAL_ASSETS_ROOT:${user.home}/TuHospedajeAssets/canonical-lodging-images}

# Base de datos — credentials must be supplied via env vars in production (no fallback)
spring.datasource.url=jdbc:mariadb://localhost:3306/tuhospedaje
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Schema lifecycle: Flyway owns schema changes; Hibernate only validates mappings.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql and hibernate.format_sql are dev-only — see application-dev.properties
spring.sql.init.mode=never
# OSIV disabled (see ADR-2 follow-up): all DTO mapping happens inside
# @Transactional service methods, so lazy collections never need to be
# touched after the transaction/request closes.
spring.jpa.open-in-view=false

# JWT — secret must be supplied via env var in production (no fallback)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=28800000

# Auth cookie — HttpOnly, Secure (HTTPS-only) in production, SameSite=Strict.
app.cookie.secure=true
app.cookie.same-site=Strict
# Refresh sessions (PR1/WU2): requires an environment-backed key ring — see
# SESSION_ACTIVE_KEY_ID/SESSION_REFRESH_KEY in .env.example (no fallback in production).
app.session.access-token-lifetime=PT15M
app.session.refresh.enabled=true
app.session.refresh.absolute-lifetime=P30D
app.session.refresh.retry-grace=${SESSION_REFRESH_RETRY_GRACE:PT5S}
app.session.key-ring.active-key-id=${SESSION_ACTIVE_KEY_ID:}
app.session.key-ring.key-entries[0].id=${SESSION_ACTIVE_KEY_ID}
app.session.key-ring.key-entries[0].secret=${SESSION_REFRESH_KEY:}
app.session.cleanup.interval=P1D
app.session.cleanup.batch-size=100
app.session.rate-limit.refresh-per-family-per-minute=10
app.session.rate-limit.refresh-per-ip-per-minute=60

# CORS — set CORS_ALLOWED_ORIGINS env var in production to restrict to your frontend URL
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# i18n (GlobalExceptionHandler messages.properties/messages_es.properties): disable
# fallback-to-system-locale. Without this, Java's ResourceBundle falls back to the JVM's
# OS default locale (not the base/neutral bundle) whenever a requested locale has no exact
# match — verified empirically on a host with LANG=es_AR.UTF-8: requesting `en` or omitting
# `Accept-Language` resolved messages_es.properties instead of the neutral English bundle.
# Disabling this makes resolution deterministic across environments regardless of host OS locale.
spring.messages.fallback-to-system-locale=false

# Pessimistic lock timeout (ms). Best-effort on MariaDB — authoritative knob is innodb_lock_wait_timeout (sec).
# A lock-wait timeout surfaces as PessimisticLockingFailureException / LockTimeoutException.
spring.jpa.properties.jakarta.persistence.lock.timeout=3000

# Email — set app.mail.smtp.enabled=true to use SMTP (Mailtrap or real SMTP)
# When disabled, emails are logged to console only
app.mail.smtp.enabled=${MAIL_SMTP_ENABLED:false}

# Mailtrap
spring.mail.host=${MAILTRAP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAILTRAP_PORT:2525}
spring.mail.username=${MAILTRAP_USERNAME:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAILTRAP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAILTRAP_TLS:true}

# Cloudinary (requerido para upload, opcional para tests)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Email outbox (durable email delivery)
tuhospedaje.email.welcome.public-base-url=${TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL}
tuhospedaje.email-outbox.enabled=true
tuhospedaje.email-outbox.poll-interval=PT30S
tuhospedaje.email-outbox.batch-size=20
tuhospedaje.email-outbox.lease-duration=PT5M
tuhospedaje.email-outbox.max-attempts=5
tuhospedaje.email-outbox.backoff[0]=PT1M
tuhospedaje.email-outbox.backoff[1]=PT5M
tuhospedaje.email-outbox.backoff[2]=PT15M
tuhospedaje.email-outbox.backoff[3]=PT1H
tuhospedaje.email-outbox.retention=P30D
tuhospedaje.email-outbox.cleanup-interval=P1D

# SMTP timeouts must stay below the outbox lease duration
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
