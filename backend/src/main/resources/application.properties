spring.application.name=tuhospedaje

# Servidor
server.port=8080

# Base de datos
spring.datasource.url=jdbc:mariadb://localhost:3306/tuhospedaje
spring.datasource.username=${DB_USERNAME:tuhospedaje}
spring.datasource.password=${DB_PASSWORD:tuhospedaje123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.defer-datasource-initialization=true

# JWT
app.jwt.secret=${JWT_SECRET:devsecret1234567890123456789012345678901234567890123456789012}
app.jwt.expiration=28800000

# Mailtrap
spring.mail.host=${MAILTRAP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAILTRAP_PORT:2525}
spring.mail.username=${MAILTRAP_USERNAME:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAILTRAP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAILTRAP_TLS:true}

# Cloudinary (requerido para upload, opcional para tests)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
