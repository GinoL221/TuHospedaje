# Test-only configuration.
# This file REPLACES src/main/resources/application.properties on the test classpath.
# All required properties must be defined here (or in a test profile).
# Testcontainers @ServiceConnection overrides datasource URL/credentials at runtime.

# Database (Testcontainers overrides URL at runtime via @ServiceConnection)
spring.datasource.url=jdbc:mariadb://localhost:3306/tuhospedaje
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Schema lifecycle: Testcontainers uses the production migration chain.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=test
spring.flyway.password=test
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Mirrors src/main/resources/application.properties (this file REPLACES it on the test
# classpath, so the production value would otherwise be absent under test). Rationale for
# the strategy and the value lives there; ListingQueryCountTest is what proves it holds.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.sql.init.mode=never

# JWT
app.jwt.secret=dGVzdHNlY3JldDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
app.jwt.expiration=28800000

# Auth cookie — Secure=false in tests (MockMvc runs over plain HTTP)
app.cookie.secure=false
app.cookie.same-site=Strict
app.session.access-token-lifetime=PT15M
app.session.refresh.enabled=false
app.session.refresh.absolute-lifetime=P30D
app.session.refresh.retry-grace=PT5S
app.session.key-ring.active-key-id=test-rt1
app.session.key-ring.key-entries[0].id=test-rt1
app.session.key-ring.key-entries[0].secret=test-only-refresh-key-not-for-production
app.session.cleanup.interval=P1D
app.session.cleanup.batch-size=100
app.session.rate-limit.enabled=true
app.session.rate-limit.refresh-per-family-per-minute=10
app.session.rate-limit.refresh-per-ip-per-minute=60

# Auth rate limiting — enabled=true is deliberate: every existing auth test must
# exercise the body-wrapping path, otherwise the suite proves nothing about the wrapper
# not breaking deserialization. Ceilings are high enough that the shared context and
# single loopback IP never trip them under normal test traffic (see design doc).
app.auth.rate-limit.enabled=true
app.auth.rate-limit.login-per-ip-per-minute=1000
app.auth.rate-limit.login-per-email-per-minute=200
app.auth.rate-limit.register-per-ip-per-minute=1000
app.auth.rate-limit.register-per-email-per-minute=200

# CORS
app.cors.allowed-origins=http://localhost:5173

# i18n (GlobalExceptionHandler) — deterministic locale resolution regardless of host OS
# locale. See src/main/resources/application.properties for the full rationale.
spring.messages.fallback-to-system-locale=false

# Pessimistic lock timeout
spring.jpa.properties.jakarta.persistence.lock.timeout=3000

# Hibernate statistics (used by query-count assertions in integration tests)
spring.jpa.properties.hibernate.generate_statistics=true

# Mail (disabled in tests)
app.mail.smtp.enabled=false
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary (empty in tests — mocked where needed)
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

# Email outbox: scheduling disabled in tests; PR1 schema/domain only
tuhospedaje.email.welcome.public-base-url=https://app.test
tuhospedaje.email-outbox.enabled=false

app.business-time-zone=America/Argentina/Buenos_Aires
