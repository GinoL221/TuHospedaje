name: Update visual baselines

# Manual only. The e2e job in ci.yml runs the suite as-is; this workflow
# regenerates tests/visual.spec.js-snapshots/*-linux.png directly on the
# same ubuntu-latest runner so pixel comparisons stop drifting against
# baselines captured on someone's local machine. Review the diff (open
# the PNGs) before trusting a green run afterward — this only proves the
# new baseline matches itself, not that the UI is correct.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: tuhospedaje_test
          MYSQL_USER: tuhospedaje
          MYSQL_PASSWORD: tuhospedaje123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Generate dev admin bcrypt hash
        id: admin-hash
        run: |
          python3 -m pip install --quiet bcrypt
          echo "hash=$(python3 -c "import bcrypt; print(bcrypt.hashpw(b'Admin1', bcrypt.gensalt(10)).decode())")" >> "$GITHUB_OUTPUT"

      - name: Start backend (dev profile + demo seed)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev
          DEV_ADMIN_PASSWORD_HASH: ${{ steps.admin-hash.outputs.hash }}
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/tuhospedaje_test
        run: nohup ./mvnw -B spring-boot:run > ../backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/lodgings > /dev/null && exit 0
            sleep 3
          done
          echo "Backend never became ready:" >&2
          tail -n 200 backend.log >&2
          exit 1

      - name: Install and start frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080/api
          # Kept in sync with ci.yml's e2e job so the baseline is captured
          # under the same conditions the real check runs under.
          VITE_WHATSAPP_NUMBER: "5491123456789"
        run: |
          npm ci
          nohup npm run dev -- --port 5173 --strictPort > ../frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          echo "Frontend never became ready:" >&2
          tail -n 200 frontend.log >&2
          exit 1

      - name: Register e2e test user
        id: test-user
        run: |
          EMAIL="e2e-ci-$(date +%s)@tuhospedaje.com"
          curl -sf -X POST http://localhost:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"firstName\":\"E2E\",\"lastName\":\"Runner\",\"email\":\"$EMAIL\",\"password\":\"Test1234\"}" \
            > /dev/null
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"

      # Kept in sync with ci.yml's e2e job — without this, "my reservations"
      # would be captured empty, the opposite of what the real check sees.
      - name: Seed a confirmed past reservation for the e2e test user
        run: |
          USER_ID=$(mysql -h 127.0.0.1 -P 3306 -u tuhospedaje -ptuhospedaje123 tuhospedaje_test -N -e \
            "SELECT id FROM users WHERE email = '${{ steps.test-user.outputs.email }}';")
          mysql -h 127.0.0.1 -P 3306 -u tuhospedaje -ptuhospedaje123 tuhospedaje_test -e \
            "INSERT INTO reservations (lodging_id, user_id, check_in, check_out, guest_name, guest_email, guest_phone, total_price, status, version)
             VALUES (1, $USER_ID, '2020-01-01', '2020-01-05', 'E2E Runner', '${{ steps.test-user.outputs.email }}', '+5491100000000', 100.00, 'CONFIRMED', 0);"

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Regenerate visual baselines
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
          TEST_ADMIN_EMAIL: admin@tuhospedaje.com
          TEST_ADMIN_PASSWORD: Admin1
          TEST_USER_EMAIL: ${{ steps.test-user.outputs.email }}
          TEST_USER_PASSWORD: Test1234
          TEST_USER_NAME: E2E
        run: npx playwright test tests/visual.spec.js --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/visual.spec.js-snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes — baselines already match this runner."
            exit 0
          fi
          git commit -m "test(e2e): regenerate visual baselines on GitHub Actions runner"
          git push
