name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v6.2.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Generate per-run backend test secrets
        run: |
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          SESSION_REFRESH_KEY=$(openssl rand -base64 48 | tr -d '\n')
          {
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'SESSION_REFRESH_KEY=%s\n' "$SESSION_REFRESH_KEY"
          } >> "$GITHUB_ENV"
      - name: Check production delivery configuration
        working-directory: .
        run: python3 -m unittest discover -s tools/tests -v
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - name: Run E2E runner unit tests
        working-directory: .
        run: node --test e2e/scripts/run-e2e.test.cjs

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_DB_USERNAME: ci_user_${{ github.run_id }}_${{ github.run_attempt }}
      CI_DB_PASSWORD: ci-db-${{ github.run_id }}-${{ github.run_attempt }}
      CI_ADMIN_PASSWORD: A${{ github.run_id }}
      CI_TEST_USER_PASSWORD: U${{ github.run_id }}
      CI_SESSION_KEY_ID: >-
        ci-session-${{ github.run_id }}-${{ github.run_attempt }}
      CI_SESSION_REFRESH_KEY: >-
        ci-refresh-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_IMAGE: >-
        mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, mobile-chromium, mobile-webkit]
    services:
      mariadb:
        # Match backend Testcontainers (mariadb:10.11) so lock/gap behavior
        # aligns.
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          # Named tuhospedaje_test (not just tuhospedaje) because the dev
          # seed's chk_dev_seed_database_name guard requires a standalone
          # "dev" or "test" segment in the database name.
          MYSQL_DATABASE: tuhospedaje_test
          MYSQL_USER: ${{ env.CI_DB_USERNAME }}
          MYSQL_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v6.2.0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # Derive the Base64 JWT secret from this immutable workflow run context.
      - name: Generate CI JWT secret
        run: |
          JWT_CONTEXT="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}"
          JWT_SECRET=$(printf '%s' "$JWT_CONTEXT" | base64 -w 0)
          printf 'CI_JWT_SECRET=%s\n' "$JWT_SECRET" >> "$GITHUB_ENV"

      # The seeded admin (db/dev/V1_9000__dev_demo_data.sql) and demo guest
      # (db/dev/V1_9001__dev_demo_guest.sql) require their bcrypt hashes as
      # Flyway placeholders — generated here so no secret needs to be stored
      # for fixed dev-only passwords. The e2e suite does not log in as the
      # demo guest; it registers its own user below.
      - name: Generate dev admin and guest bcrypt hashes
        id: admin-hash
        env:
          DEV_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          DEV_GUEST_PASSWORD: G${{ github.run_id }}
        run: |
          python3 -m pip install --quiet bcrypt
          hash_of() {
            python3 - "$1" <<'PY'
          import bcrypt
          import os
          import sys
          print(bcrypt.hashpw(
              os.environ[sys.argv[1]].encode(), bcrypt.gensalt(10)
          ).decode())
          PY
          }
          HASH=$(hash_of DEV_ADMIN_PASSWORD)
          GUEST_HASH=$(hash_of DEV_GUEST_PASSWORD)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "guest-hash=$GUEST_HASH" >> "$GITHUB_OUTPUT"

      - name: Start backend (dev profile + demo seed)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev
          DEV_ADMIN_PASSWORD_HASH: ${{ steps.admin-hash.outputs.hash }}
          DEV_GUEST_PASSWORD_HASH: ${{ steps.admin-hash.outputs.guest-hash }}
          # application.properties hardcodes the DB name to "tuhospedaje";
          # override it to match the service container's tuhospedaje_test.
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/tuhospedaje_test
          SPRING_DATASOURCE_USERNAME: ${{ env.CI_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.CI_DB_PASSWORD }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          SESSION_ACTIVE_KEY_ID: ${{ env.CI_SESSION_KEY_ID }}
          SESSION_REFRESH_KEY: ${{ env.CI_SESSION_REFRESH_KEY }}
        run: nohup ./mvnw -B spring-boot:run > ../backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/api/lodgings > /dev/null && exit 0
            sleep 3
          done
          echo "Backend never became ready:" >&2
          tail -n 200 backend.log >&2
          exit 1

      - name: Install and start frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080/api
          # Must satisfy WhatsAppButton's PHONE_PATTERN (/^[1-9]\d{7,14}$/).
          # Invalid or missing build-time configuration intentionally renders no
          # WhatsApp control; Vitest covers that branch. The E2E spec asserts
          # the rendered declarative wa.me link contract.
          VITE_WHATSAPP_NUMBER: "5491123456789"
        run: |
          npm ci
          nohup npm run dev -- --port 5173 --strictPort > ../frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && exit 0
            sleep 2
          done
          echo "Frontend never became ready:" >&2
          tail -n 200 frontend.log >&2
          exit 1

      # No regular user is seeded (only the admin) — auth.spec.js and
      # reservations.spec.js need one to already exist via TEST_USER_EMAIL.
      - name: Register e2e test user
        id: test-user
        env:
          TEST_USER_PASSWORD: ${{ env.CI_TEST_USER_PASSWORD }}
        run: |
          EMAIL="e2e-ci-$(date +%s)@tuhospedaje.com"
          PAYLOAD=$(printf '%s%s%s%s%s' \
            '{"firstName":"E2E","lastName":"Runner","email":"' \
            "$EMAIL" \
            '","password":"' \
            "$TEST_USER_PASSWORD" \
            '"}')
          curl -sf -X POST http://localhost:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"

      # tests/reviews.spec.js assumes LODGING_ELIGIBLE (id=1, seeded by
      # V1_9000__dev_demo_data.sql) already has a CONFIRMED reservation with a
      # past checkout for the test user — the public API rejects past dates
      # (@FutureOrPresent on CreateReservationRequest), so this can only be
      # done with a direct insert, once the just-registered user's real id is
      # known.
      - name: Seed a confirmed past reservation for the e2e test user
        env:
          MYSQL_PWD: ${{ env.CI_DB_PASSWORD }}
        run: |
          MYSQL_ARGS=(-h 127.0.0.1 -P 3306 -u "$CI_DB_USERNAME")
          USER_EMAIL='${{ steps.test-user.outputs.email }}'
          USER_ID=$(mysql "${MYSQL_ARGS[@]}" tuhospedaje_test -N -e \
            "SELECT id FROM users WHERE email = '$USER_EMAIL';")
          mysql "${MYSQL_ARGS[@]}" tuhospedaje_test -e \
            "INSERT INTO reservations (
               lodging_id, user_id, check_in, check_out, guest_name,
               guest_email, guest_phone, total_price, status, version
             ) VALUES (
               1, $USER_ID, '2020-01-01', '2020-01-05', 'E2E Fixture',
               'e2e-fixture@tuhospedaje.com', '+5491100000000', 100.00,
               'CONFIRMED', 0
             );"

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Pull Playwright container image
        run: docker pull "$PLAYWRIGHT_IMAGE"

      - name: Run e2e tests
        id: e2e-tests
        env:
          BASE_URL: http://localhost:5173
          TEST_ADMIN_EMAIL: admin@tuhospedaje.com
          TEST_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          TEST_USER_EMAIL: ${{ steps.test-user.outputs.email }}
          TEST_USER_PASSWORD: ${{ env.CI_TEST_USER_PASSWORD }}
          TEST_USER_NAME: E2E
          E2E_ENABLE_WEBKIT: >-
            ${{ matrix.browser == 'mobile-webkit' && '1' || '0' }}
        run: |
          docker run --rm --init --network host --shm-size 512m \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/e2e:/workspace/e2e" \
            -w /workspace/e2e \
            -e HOME=/tmp \
            -e XDG_CACHE_HOME=/tmp/fontcache \
            -e CI=true \
            -e BASE_URL \
            -e TEST_ADMIN_EMAIL \
            -e TEST_ADMIN_PASSWORD \
            -e TEST_USER_EMAIL \
            -e TEST_USER_PASSWORD \
            -e TEST_USER_NAME \
            -e E2E_ENABLE_WEBKIT \
            "$PLAYWRIGHT_IMAGE" \
            ./node_modules/.bin/playwright test \
            --project="${{ matrix.browser }}"

      - name: Summarize E2E retry status
        if: >-
          ${{ !cancelled() &&
          (steps.e2e-tests.outcome == 'success' ||
          steps.e2e-tests.outcome == 'failure') }}
        env:
          E2E_OUTCOME: ${{ steps.e2e-tests.outcome }}
          E2E_BROWSER: ${{ matrix.browser }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const browser = process.env.E2E_BROWSER || 'unknown';
          const outcome = process.env.E2E_OUTCOME || 'unknown';
          const resultsPath = path.join('e2e', 'test-results', 'results.json');
          const recovered = [];
          let missingResults = false;
          let parseError = '';

          function walkSuite(suite, parents) {
            const next = suite.title ? [...parents, suite.title] : parents;
            for (const spec of suite.specs || []) {
              const title = [...next, spec.title].filter(Boolean).join(' > ');
              for (const test of spec.tests || []) {
                const results = Array.isArray(test.results) ? test.results : [];
                const isRecovered =
                  test.status === 'flaky' ||
                  results.some((r) => r.retry > 0 && r.status === 'passed');
                if (isRecovered) {
                  recovered.push(title);
                }
              }
            }
            for (const child of suite.suites || []) {
              walkSuite(child, next);
            }
          }

          if (fs.existsSync(resultsPath)) {
            try {
              const data = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              for (const suite of data.suites || []) {
                walkSuite(suite, []);
              }
            } catch (err) {
              parseError = err instanceof Error ? err.message : String(err);
            }
          } else {
            missingResults = true;
          }

          const lines = [];
          if (outcome === 'failure') {
            lines.push(`### E2E (${browser}): FINAL_E2E_FAILURE`);
            if (missingResults) {
              lines.push('- `results.json` was not generated.');
            } else if (parseError) {
              lines.push(`- results.json parse error: ${parseError}`);
            }
            if (recovered.length > 0) {
              const count = recovered.length;
              lines.push(`- Recovered on retry before failure (${count}):`);
              for (const title of recovered) {
                lines.push(`  - ${title}`);
              }
            }
          } else if (missingResults || parseError) {
            lines.push(`### E2E (${browser}): E2E_PASS_RESULTS_UNAVAILABLE`);
            if (missingResults) {
              lines.push('- `results.json` was not generated.');
            } else {
              lines.push(`- results.json parse error: ${parseError}`);
            }
          } else if (recovered.length > 0) {
            const count = recovered.length;
            lines.push(`### E2E (${browser}): RECOVERED_PASS (${count})`);
            for (const title of recovered) {
              lines.push(`- ${title}`);
            }
          } else {
            lines.push(`### E2E (${browser}): E2E_PASS_FIRST_ATTEMPT`);
          }

          const output = `${lines.join('\n')}\n`;
          process.stdout.write(output);
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, output, 'utf8');
          }
          NODE

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  containers:
    if: >-
      ${{ github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v'))) }}
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Define immutable image tags
        id: images
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LOWER=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          BACKEND="$REGISTRY/$OWNER_LOWER/tuhospedaje-backend:sha-$GITHUB_SHA"
          FRONTEND="$REGISTRY/$OWNER_LOWER/tuhospedaje-frontend:sha-$GITHUB_SHA"
          BACKEND_TAGS="$BACKEND"
          FRONTEND_TAGS="$FRONTEND"
          TAG_REGEX='^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+.*)$'
          if [[ "$GITHUB_REF" =~ $TAG_REGEX ]]; then
            RELEASE_TAG="${BASH_REMATCH[1]}"
            EXTRA_B=",$REGISTRY/$OWNER_LOWER/tuhospedaje-backend:$RELEASE_TAG"
            EXTRA_B="$EXTRA_B,$REGISTRY/$OWNER_LOWER/tuhospedaje-backend:latest"
            EXTRA_F=",$REGISTRY/$OWNER_LOWER/tuhospedaje-frontend:$RELEASE_TAG"
            EXTRA_F="$EXTRA_F,$REGISTRY/$OWNER_LOWER/tuhospedaje-frontend:latest"
            BACKEND_TAGS="$BACKEND_TAGS$EXTRA_B"
            FRONTEND_TAGS="$FRONTEND_TAGS$EXTRA_F"
          fi
          {
            echo "backend=$BACKEND"
            echo "frontend=$FRONTEND"
            echo "backend_tags=$BACKEND_TAGS"
            echo "frontend_tags=$FRONTEND_TAGS"
          } >> "$GITHUB_OUTPUT"

      # v4.4.1
      # yamllint disable-line rule:line-length
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build backend production image
        # v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.images.outputs.backend }}

      - name: Build frontend production image
        # v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: frontend
          load: true
          push: false
          tags: ${{ steps.images.outputs.frontend }}
          build-args: |
            VITE_API_URL=/api
            VITE_WHATSAPP_NUMBER=${{ vars.VITE_WHATSAPP_NUMBER }}

      - name: Scan backend image
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.images.outputs.backend }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan frontend image
        # v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.images.outputs.frontend }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Login to GitHub Container Registry
        if: >-
          ${{ github.event_name == 'push' &&
              (github.ref == 'refs/heads/main' ||
               startsWith(github.ref, 'refs/tags/v')) }}
        # v4.8.0
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish scanned images and record digest references
        if: >-
          ${{ github.event_name == 'push' &&
              (github.ref == 'refs/heads/main' ||
               startsWith(github.ref, 'refs/tags/v')) }}
        env:
          BACKEND_TAGS: ${{ steps.images.outputs.backend_tags }}
          FRONTEND_TAGS: ${{ steps.images.outputs.frontend_tags }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          push_with_retry() {
            local tag="$1"
            local max_attempts=3
            local attempt=1
            until docker push "$tag"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Failed to push $tag after $max_attempts attempts" >&2
                return 1
              fi
              echo "Push failed: $tag ($attempt/$max_attempts), retrying..."
              sleep 5
              attempt=$((attempt + 1))
            done
          }

          IFS=',' read -ra B_TAGS <<< "$BACKEND_TAGS"
          for tag in "${B_TAGS[@]}"; do
            docker tag "$BACKEND_IMAGE" "$tag"
            push_with_retry "$tag"
          done

          IFS=',' read -ra F_TAGS <<< "$FRONTEND_TAGS"
          for tag in "${F_TAGS[@]}"; do
            docker tag "$FRONTEND_IMAGE" "$tag"
            push_with_retry "$tag"
          done

          DIGEST_FORMAT='{{index .RepoDigests 0}}'
          BACKEND_DIGEST=$(docker image inspect "$BACKEND_IMAGE" \
            --format "$DIGEST_FORMAT")
          FRONTEND_DIGEST=$(docker image inspect "$FRONTEND_IMAGE" \
            --format "$DIGEST_FORMAT")
          case "$BACKEND_DIGEST" in ghcr.io/*@sha256:*) ;; *) exit 1 ;; esac
          case "$FRONTEND_DIGEST" in ghcr.io/*@sha256:*) ;; *) exit 1 ;; esac
          printf '%s\n' "$BACKEND_DIGEST" > image-references.txt
          printf '%s\n' "$FRONTEND_DIGEST" >> image-references.txt

      - name: Upload published image references
        if: >-
          ${{ github.event_name == 'push' &&
              (github.ref == 'refs/heads/main' ||
               startsWith(github.ref, 'refs/tags/v')) }}
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-references-${{ github.sha }}
          path: image-references.txt
          retention-days: 30
