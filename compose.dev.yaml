name: tuhospedaje-dev

services:
  db:
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DEV_DB_NAME:?DEV_DB_NAME is required}
      MARIADB_USER: ${DEV_DB_USERNAME:?DEV_DB_USERNAME is required}
      MARIADB_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      # yamllint disable-line rule:line-length
      MARIADB_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:?DEV_DB_ROOT_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        # yamllint disable-line rule:line-length
        - mariadb-admin ping -h localhost -u"$$MARIADB_USER" -p"$$MARIADB_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
      - dev-uploads:/uploads
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # yamllint disable-line rule:line-length
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/${DEV_DB_NAME:?DEV_DB_NAME is required}
      # yamllint disable-line rule:line-length
      SPRING_DATASOURCE_USERNAME: ${DEV_DB_USERNAME:?DEV_DB_USERNAME is required}
      # yamllint disable-line rule:line-length
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      JWT_SECRET: ${DEV_JWT_SECRET:?DEV_JWT_SECRET is required}
      SESSION_ACTIVE_KEY_ID: dev
      # yamllint disable-line rule:line-length
      SESSION_REFRESH_KEY: ${DEV_SESSION_REFRESH_KEY:?DEV_SESSION_REFRESH_KEY is required}
      CORS_ALLOWED_ORIGINS: http://localhost:${DEV_FRONTEND_PORT:-5173}
      # Writable directory on the dev-uploads volume so uploaded images
      # survive restarts.
      TUHOSPEDAJE_UPLOADS_DIR: ${TUHOSPEDAJE_UPLOADS_DIR:-/uploads}
      # Vite serves the frontend on its own origin without an API proxy, so
      # image URLs must be absolute against the backend origin; override to
      # move it. NOTE: this line exceeds the 80-column lint by design — the
      # nested ${DEV_BACKEND_PORT} default cannot be split across lines.
      TUHOSPEDAJE_UPLOADS_PUBLIC_PREFIX:
        ${TUHOSPEDAJE_UPLOADS_PUBLIC_PREFIX:-http://localhost:${DEV_BACKEND_PORT:-8080}/uploads}
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://localhost:8080/actuator/health/readiness
          || exit 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:${DEV_BACKEND_PORT:-8080}/api
      # Fictional demonstration number; not a real contact channel.
      VITE_WHATSAPP_NUMBER: "12025550100"
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:5173/ > /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
    name: tuhospedaje-dev-db
  maven-cache:
  frontend-node-modules:
  dev-uploads:
    name: tuhospedaje-dev-uploads
