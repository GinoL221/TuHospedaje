name: tuhospedaje-dev

services:
  db:
    ports:
      - "${DEV_DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${DEV_DB_NAME:?DEV_DB_NAME is required}
      MARIADB_USER: ${DEV_DB_USERNAME:?DEV_DB_USERNAME is required}
      MARIADB_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DEV_DB_ROOT_PASSWORD:?DEV_DB_ROOT_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h localhost -u"$$MARIADB_USER" -p"$$MARIADB_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/${DEV_DB_NAME:?DEV_DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${DEV_DB_USERNAME:?DEV_DB_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      JWT_SECRET: ${DEV_JWT_SECRET:?DEV_JWT_SECRET is required}
      SESSION_ACTIVE_KEY_ID: dev
      SESSION_REFRESH_KEY: ${DEV_SESSION_REFRESH_KEY:?DEV_SESSION_REFRESH_KEY is required}
      CORS_ALLOWED_ORIGINS: http://localhost:${DEV_FRONTEND_PORT:-5173}
    ports:
      - "${DEV_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:${DEV_BACKEND_PORT:-8080}/api
    ports:
      - "${DEV_FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
    name: tuhospedaje-dev-db
  maven-cache:
  frontend-node-modules:
