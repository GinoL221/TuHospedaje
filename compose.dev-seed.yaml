name: tuhospedaje-dev-seeded

services:
  backend:
    environment:
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev
    volumes:
      - ./deploy/dev.env:/run/dev-admin.env:ro
    entrypoint: ["/bin/sh", "/workspace/docker/seed-entrypoint.sh"]

volumes:
  db-data:
    name: tuhospedaje-dev-seeded-db
