services:
  db:
    image: mariadb:10.11
    container_name: tuhospedaje-dev-db
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: tuhospedaje_dev
      MARIADB_USER: tuhospedaje
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
