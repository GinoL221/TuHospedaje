name: tuhospedaje-prod

services:
  db:
    environment:
      MARIADB_DATABASE: ${PROD_DB_NAME:?PROD_DB_NAME is required}
      MARIADB_ROOT_PASSWORD: ${PROD_DB_ROOT_PASSWORD:?PROD_DB_ROOT_PASSWORD is required}
    volumes:
      - prod-db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MARIADB_ROOT_PASSWORD" mariadb-admin ping -h localhost -u root --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db-provision:
    image: mariadb:10.11
    profiles:
      - provision
    restart: "no"
    networks:
      - data
    volumes:
      - ./ops/mariadb/provision-accounts.sh:/usr/local/bin/provision-accounts.sh:ro
    environment:
      PROD_DB_NAME: ${PROD_DB_NAME:?PROD_DB_NAME is required}
      PROD_DB_ROOT_PASSWORD: ${PROD_DB_ROOT_PASSWORD:?PROD_DB_ROOT_PASSWORD is required}
      DB_RUNTIME_USERNAME: ${DB_RUNTIME_USERNAME:?DB_RUNTIME_USERNAME is required}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?DB_RUNTIME_PASSWORD is required}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:?DB_MIGRATION_USERNAME is required}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD is required}
    entrypoint: ["/bin/bash", "/usr/local/bin/provision-accounts.sh"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/${PROD_DB_NAME:?PROD_DB_NAME is required}
      DB_USERNAME: ${DB_RUNTIME_USERNAME:?DB_RUNTIME_USERNAME is required}
      DB_PASSWORD: ${DB_RUNTIME_PASSWORD:?DB_RUNTIME_PASSWORD is required}
      SPRING_FLYWAY_URL: jdbc:mariadb://db:3306/${PROD_DB_NAME:?PROD_DB_NAME is required}
      SPRING_FLYWAY_USER: ${DB_MIGRATION_USERNAME:?DB_MIGRATION_USERNAME is required}
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_ACTIVE_KEY_ID: ${SESSION_ACTIVE_KEY_ID:?SESSION_ACTIVE_KEY_ID is required}
      SESSION_REFRESH_KEY: ${SESSION_REFRESH_KEY:?SESSION_REFRESH_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL: ${TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL:?TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL is required}
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-America/Argentina/Buenos_Aires}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_SMTP_ENABLED: ${MAIL_SMTP_ENABLED:-false}
      MAILTRAP_HOST: ${MAILTRAP_HOST:-}
      MAILTRAP_PORT: ${MAILTRAP_PORT:-2525}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME:-}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    ports:
      - "${PROD_HTTP_BIND_ADDRESS:-127.0.0.1}:${PROD_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  prod-db-data:
    name: tuhospedaje-prod-db
