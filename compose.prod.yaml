services:
  backend:
    image: ${TUHOSPEDAJE_BACKEND_IMAGE:?Set TUHOSPEDAJE_BACKEND_IMAGE to a GHCR image@sha256 reference emitted by CI}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL for the external database}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:?Set DB_MIGRATION_USERNAME}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SESSION_ACTIVE_KEY_ID: ${SESSION_ACTIVE_KEY_ID:?Set SESSION_ACTIVE_KEY_ID}
      SESSION_REFRESH_KEY: ${SESSION_REFRESH_KEY:?Set SESSION_REFRESH_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL: ${TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL:?Set TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET}
      MAIL_SMTP_ENABLED: ${MAIL_SMTP_ENABLED:?Set MAIL_SMTP_ENABLED}
      MAILTRAP_HOST: ${MAILTRAP_HOST:?Set MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT:?Set MAILTRAP_PORT}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME:?Set MAILTRAP_USERNAME}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD:?Set MAILTRAP_PASSWORD}
    ports:
      - "127.0.0.1:${TUHOSPEDAJE_BACKEND_PORT:-8080}:8080"

  frontend:
    image: ${TUHOSPEDAJE_FRONTEND_IMAGE:?Set TUHOSPEDAJE_FRONTEND_IMAGE to a GHCR image@sha256 reference emitted by CI}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${TUHOSPEDAJE_FRONTEND_PORT:-8081}:8080"
