# Persistent local development, separate from existing dev/prod volumes.
name: tuhospedaje-local

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: tuhospedaje_local_dev
      MARIADB_USER: local_app
      MARIADB_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?required}
    volumes:
      - db-data:/var/lib/mysql
    networks: [data]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MARIADB_PASSWORD" mariadb-admin ping
          -h 127.0.0.1 -u"$$MARIADB_USER" --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    entrypoint: [/bin/sh, /workspace/docker/seed-entrypoint.sh]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: ""
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/tuhospedaje_local_dev
      SPRING_DATASOURCE_USERNAME: local_app
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD:?required}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev
      JWT_SECRET: ${LOCAL_JWT_SECRET:?LOCAL_JWT_SECRET is required}
      SESSION_ACTIVE_KEY_ID: local
      SESSION_REFRESH_KEY: ${LOCAL_SESSION_REFRESH_KEY:?required}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      TUHOSPEDAJE_CANONICAL_ASSETS_ROOT: /canonical
      TUHOSPEDAJE_WELCOME_PUBLIC_BASE_URL: https://app.example
      MAIL_SMTP_ENABLED: "false"
      SPRING_JPA_SHOW_SQL: "false"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - type: bind
        source: ./backend
        target: /workspace
      - maven-cache:/root/.m2
      - type: bind
        source: ./deploy/local-admin.env
        target: /run/dev-admin.env
        read_only: true
        bind:
          create_host_path: false
      # Only masters are exposed; prompts and evidence stay private.
      - type: bind
        source: >-
          ${CANONICAL_ASSETS_HOST_DIR:?required}/lodging-001-hotel-buenos-aires-centro/masters
        target: /canonical/lodging-001-hotel-buenos-aires-centro/masters
        read_only: true
        bind:
          create_host_path: false
      - type: bind
