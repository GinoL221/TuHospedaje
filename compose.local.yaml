      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://127.0.0.1:8080/api
      # Fictional number; never used to demonstrate message delivery.
      VITE_WHATSAPP_NUMBER: "12025550100"
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:5173/ > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

